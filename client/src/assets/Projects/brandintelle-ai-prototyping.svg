    <text x="1192" y="622" fill="#C3B59D" font-family="Arial, sans-serif" font-size="14">Prototype speed</text>
    <text x="1192" y="658" fill="#C3B59D" font-family="Arial, sans-serif" font-size="14">Internal alignment</text>
