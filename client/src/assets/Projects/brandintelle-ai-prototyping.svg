  <text x="1195" y="258" fill="#F3E7D2" font-family="Arial, sans-serif" font-size="28" font-weight="700">AI</text>
  <rect x="122" y="124" width="960" height="752" rx="28" fill="#1B1B16" stroke="#C8A56E" stroke-opacity="0.18"/>
  <text x="184" y="198" fill="#F3E7D2" font-family="Arial, sans-serif" font-size="34" font-weight="700">AI-assisted prototyping inside product work</text>
  <text x="184" y="238" fill="#C3B59D" font-family="Arial, sans-serif" font-size="18">Breaking vague founder direction into faster loops of structure, explanation, and product movement</text>
  <rect x="184" y="290" width="836" height="132" rx="24" fill="#232119"/>
  <text x="224" y="342" fill="#C8A56E" font-family="Arial, sans-serif" font-size="18" font-weight="600">01</text>
  <text x="272" y="342" fill="#F3E7D2" font-family="Arial, sans-serif" font-size="26" font-weight="700">Take the vague ask</text>
  <text x="272" y="378" fill="#C3B59D" font-family="Arial, sans-serif" font-size="16">Unclear requests arrive as “let’s build something smarter” or “make this module clearer.”</text>
  <rect x="184" y="450" width="836" height="132" rx="24" fill="#232119"/>
  <text x="224" y="502" fill="#8FA278" font-family="Arial, sans-serif" font-size="18" font-weight="600">02</text>
  <text x="272" y="502" fill="#F3E7D2" font-family="Arial, sans-serif" font-size="26" font-weight="700">Decompose the system</text>
  <text x="272" y="538" fill="#C3B59D" font-family="Arial, sans-serif" font-size="16">Use AI to map the actors, inputs, dependencies, and likely user questions faster.</text>
  <rect x="184" y="610" width="836" height="132" rx="24" fill="#232119"/>
  <text x="224" y="662" fill="#6F8FA6" font-family="Arial, sans-serif" font-size="18" font-weight="600">03</text>
  <text x="272" y="662" fill="#F3E7D2" font-family="Arial, sans-serif" font-size="26" font-weight="700">Prototype the clearer version</text>
  <text x="272" y="698" fill="#C3B59D" font-family="Arial, sans-serif" font-size="16">Turn the insight into workflows, rough UI logic, and internal communication people can act on.</text>
  <g>
    <rect x="1136" y="420" width="304" height="344" rx="28" fill="#201E18" stroke="#8FA278" stroke-opacity="0.2"/>
    <text x="1180" y="488" fill="#F3E7D2" font-family="Arial, sans-serif" font-size="28" font-weight="700">AI layer</text>
    <text x="1180" y="526" fill="#C3B59D" font-family="Arial, sans-serif" font-size="16">Used for speed, structure, and iteration</text>
    <rect x="1180" y="572" width="216" height="18" rx="9" fill="#2D2B23"/>
    <rect x="1180" y="608" width="180" height="18" rx="9" fill="#2D2B23"/>
